apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: innovate-dev-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/charanprathi/innovate-inc-aws-infra.git'
    targetRevision: HEAD
    path: local/apps/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
