name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: charanprathi/innovate-app

permissions: {}

concurrency:
  group: build-and-push
  cancel-in-progress: false

jobs:
  scan:
    name: Scan image (report only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build -t scan-target:${{ github.sha }} ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

  publish:
    name: Build, push GHCR and update dev manifest
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        run: |
          IMAGE="$REGISTRY/$IMAGE_NAME"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" ./app
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Point dev manifest at the new image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          manifest=local/apps/dev/app-deploy.yaml
          [ "$(grep -cE '^[[:space:]]*image:' "$manifest")" = "1" ] || { echo "::error::expected exactly one image line in $manifest"; exit 1; }
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*).+\$#\1${IMAGE}#" "$manifest"
          grep -q "${GITHUB_SHA}" "$manifest" || { echo "::error::manifest was not updated"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifest already at ${GITHUB_SHA}; nothing to commit"
          else
            git add "$manifest"
            git commit -m "ci: deploy ${GITHUB_SHA::7} to dev [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
