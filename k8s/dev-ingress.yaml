apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innovate-dev-ingress
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/subnets: "subnet-046670ac2299e215e, subnet-013272453a073a268"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: innovate-flask-service
                port:
                  number: 80
