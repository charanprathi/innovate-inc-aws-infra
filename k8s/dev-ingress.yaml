apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innovate-dev-ingress
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/subnets: "subnet-046670ac2299e215e, subnet-013272453a073a268"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:811165582680:certificate/53c98495-9791-4972-8c99-f8f0ab4d5a1f"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
    - host: "emergencydashboard.online"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: innovate-flask-service
                port:
                  number: 80
