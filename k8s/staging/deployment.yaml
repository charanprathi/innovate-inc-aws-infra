apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovate-flask-app
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innovate-flask-app
  template:
    metadata:
      labels:
        app: innovate-flask-app
    spec:
      containers:
      - name: flask-app
        image: 811165582680.dkr.ecr.us-east-1.amazonaws.com/innovate-inc-app-staging:latest
        ports:
        - containerPort: 5000
