apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovate-flask-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: 811165582680.dkr.ecr.us-east-1.amazonaws.com/innovate-inc-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: "dev"
---
apiVersion: v1
kind: Service
metadata:
  name: innovate-flask-service
  namespace: dev
spec:
  type: ClusterIP
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
