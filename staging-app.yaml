apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: innovate-flask-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charanprathi/innovate-inc-aws-infra.git
    targetRevision: develop
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
