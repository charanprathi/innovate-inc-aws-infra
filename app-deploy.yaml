apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovate-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innovate-app
  template:
    metadata:
      labels:
        app: innovate-app
    spec:
      containers:
      - name: innovate-flask-app
        image: innovate-app:local
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: postgres-svc
        - name: DB_NAME
          value: innovate_dev
        - name: DB_USER
          value: dbadmin
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
        - name: APP_ENV
          value: development
---
apiVersion: v1
kind: Service
metadata:
  name: innovate-app-svc
  namespace: dev
spec:
  ports:
  - port: 80
    targetPort: 5000
  selector:
    app: innovate-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innovate-app-ingress
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: emergencydashboard.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: innovate-app-svc
            port:
              number: 80
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: innovate-app-svc
            port:
              number: 80